[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epitaph"
version = "0.1.0"
description = "Event-driven asynchronous OSINT profile scanner with TUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=1.10.0",
    "httpx[http2]>=0.27.0",
    "textual>=0.60.0",
    "jinja2>=3.1.4",
    "aiofiles>=23.2.1",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.44.0",
]
full = [
    "playwright>=1.44.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
epitaph = "epitaph.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
